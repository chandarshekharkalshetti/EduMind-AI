services:
  - type: web
    name: edumind-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_careers.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: data/edumind.db
      - key: GEMINI_API_KEY
        sync: false
